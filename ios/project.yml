name: Mailcrane
options:
  bundleIdPrefix: app
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  MailcraneCore:
    path: MailcraneCore

targets:
  Mailcrane:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Mailcrane
    dependencies:
      - package: MailcraneCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.mailcrane
        SWIFT_VERSION: "5.10"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Mailcrane
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    buildPhases:
      - type: shell
        name: SwiftLint
        script: |
          if command -v swiftlint >/dev/null 2>&1; then
            swiftlint lint --strict --config "${SRCROOT}/.swiftlint.yml"
          else
            echo "warning: SwiftLint is not installed; skipping lint"
          fi

  MailcraneTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - MailcraneTests
    dependencies:
      - target: Mailcrane
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  MailcraneUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - MailcraneUITests
    dependencies:
      - target: Mailcrane
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Mailcrane:
    build:
      targets:
        Mailcrane: all
        MailcraneTests: [test]
        MailcraneUITests: [test]
    test:
      targets:
        - MailcraneTests
        - MailcraneUITests
