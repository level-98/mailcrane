# The Rust compiler every build uses: developers, CI and F-Droid. Release
# builds must be reproducible (docs/fdroid.md), and a different compiler makes
# different machine code. To update, change the version here and in the
# `toolchain:` lines of .github/workflows/ci.yml and ios.yml, in one PR.
[toolchain]
channel = "1.100.0"
components = ["rustfmt", "clippy"]
# cargo-ndk builds the core for these when Gradle runs.
targets = ["aarch64-linux-android", "x86_64-linux-android"]
profile = "minimal"
