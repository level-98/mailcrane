[package]
name = "mailcrane-smtp"
description = "Sending"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.22"
rustls = "0.23.46"
rustls-platform-verifier = "0.7.1"
tokio = { version = "1.54.1", features = ["net", "time", "io-util"] }
tokio-rustls = "0.26.6"

[dev-dependencies]
mailcrane-testkit = { path = "../mailcrane-testkit" }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "time", "io-util"] }
