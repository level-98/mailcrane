[package]
name = "mailcrane-core"
description = "Accounts, sync scheduling, the public API"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Debug builds only (#289): importing tests/fixtures into a local-only
# account. Turned on by mailcrane-ffi's `debug-fixtures`; never in release.
fixtures = []

[dependencies]
# Only for SHA-256 (PKCE); the same backend rustls uses, with no extra features.
aws-lc-rs = { version = "1.19.0", default-features = false, features = ["aws-lc-sys"] }
base64 = "0.23"
getrandom = "0.4.3"
http-body-util = "0.1.5"
hyper = { version = "1.13.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
mailcrane-imap = { path = "../mailcrane-imap" }
mailcrane-jmap = { path = "../mailcrane-jmap" }
mailcrane-mime = { path = "../mailcrane-mime" }
mailcrane-sieve = { path = "../mailcrane-sieve" }
mailcrane-smtp = { path = "../mailcrane-smtp" }
mailcrane-store = { path = "../mailcrane-store" }
quick-xml = "0.42.0"
rustls = "0.23.46"
rustls-platform-verifier = "0.7.1"
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["time", "macros", "net", "io-util", "sync"] }
tokio-rustls = "0.26.6"
tracing = "0.1"
url = "2.5.9"
zeroize = "1.9.2"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time", "test-util"] }
mailcrane-testkit = { path = "../mailcrane-testkit" }
proptest = "1"
rusqlite = { version = "0.43.0", features = ["bundled"] }
tempfile = "3.27.0"
