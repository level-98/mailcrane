[package]
name = "mailcrane-core"
description = "Accounts, sync scheduling, the public API"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
mailcrane-imap = { path = "../mailcrane-imap" }
mailcrane-mime = { path = "../mailcrane-mime" }
mailcrane-smtp = { path = "../mailcrane-smtp" }
mailcrane-store = { path = "../mailcrane-store" }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["time", "macros"] }
tracing = "0.1"
zeroize = "1.9.2"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time"] }
mailcrane-testkit = { path = "../mailcrane-testkit" }
