[package]
name = "mailcrane-core"
description = "Accounts, sync scheduling, the public API"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
http-body-util = "0.1.5"
hyper = { version = "1.13.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
mailcrane-imap = { path = "../mailcrane-imap" }
mailcrane-mime = { path = "../mailcrane-mime" }
mailcrane-smtp = { path = "../mailcrane-smtp" }
mailcrane-store = { path = "../mailcrane-store" }
quick-xml = "0.42.0"
rustls = "0.23.46"
rustls-platform-verifier = "0.7.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["time", "macros", "net", "io-util"] }
tokio-rustls = "0.26.6"
tracing = "0.1"
url = "2.5.9"
zeroize = "1.9.2"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time", "test-util"] }
mailcrane-testkit = { path = "../mailcrane-testkit" }
proptest = "1"
tempfile = "3.27.0"
