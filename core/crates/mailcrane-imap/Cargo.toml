[package]
name = "mailcrane-imap"
description = "IMAP client, IDLE, CONDSTORE/QRESYNC, server quirks"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
mailcrane-store = { path = "../mailcrane-store" }
rustls = "0.23.46"
rustls-platform-verifier = "0.7.1"
thiserror = "2.0.21"
# `macros` for `tokio::select!` in IDLE (idle.rs).
tokio = { version = "1.54.1", features = ["macros", "net", "time", "io-util"] }
tokio-rustls = "0.26.6"
tracing = "0.1"

[dev-dependencies]
mailcrane-testkit = { path = "../mailcrane-testkit" }
proptest = "1"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "time", "io-util", "test-util"] }
