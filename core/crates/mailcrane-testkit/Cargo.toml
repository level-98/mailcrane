[package]
name = "mailcrane-testkit"
description = "Fake IMAP, SMTP and JMAP servers for tests, able to misbehave on purpose"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
mailcrane-core = { path = "../mailcrane-core" }
http-body-util = "0.1.5"
hyper = { version = "1.13.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["server", "http1", "tokio"] }
rcgen = "0.14.10"
rustls = "0.23.46"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["net", "macros", "rt-multi-thread", "time", "sync", "io-util"] }
tokio-rustls = "0.26.6"
url = "2.5.9"
