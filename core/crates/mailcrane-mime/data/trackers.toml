# Known email-tracking services (M5-01, #62).
#
# Written for Mailcrane from public vendor documentation and from the source
# of the vendors' own emails; not copied from any other block list.
#
# Each entry:
#   service = shown to the user
#   domains = hosts; an image from the host or any subdomain of it matches
#   paths   = optional; when given, only images whose URL path starts with
#             one of them match (for domains that also serve real images)
#   source  = where the information comes from
#
# Format: only `[[tracker]]` headers and `key = "string"` or
# `key = ["string", ...]` lines on one line each; `#` starts a comment.

[[tracker]]
service = "Mailchimp"
domains = ["list-manage.com"]
source = "Mailchimp help centre, 'About open tracking': opens are counted with a tiny image served from the account's list-manage.com host."

[[tracker]]
service = "Mandrill (Mailchimp Transactional)"
domains = ["mandrillapp.com"]
paths = ["/track/open"]
source = "Mandrill docs on open tracking: a tracking image under /track/open on mandrillapp.com. The domain also serves the app, so only that path is matched."

[[tracker]]
service = "SendGrid (Twilio)"
domains = ["sendgrid.net"]
paths = ["/wf/open"]
source = "SendGrid docs, 'Open Tracking': an invisible image whose URL path starts with /wf/open on the sendgrid.net tracking host."

[[tracker]]
service = "Constant Contact"
domains = ["rs6.net"]
source = "Constant Contact help on email reporting: tracked opens and clicks go through rs6.net hosts."

[[tracker]]
service = "Campaign Monitor"
domains = ["createsend1.com"]
source = "Campaign Monitor help on open tracking: an invisible image on a createsend1.com host."

[[tracker]]
service = "HubSpot"
domains = ["hubspotemail.net"]
source = "HubSpot knowledge base on email open tracking: a tracking image served from hubspotemail.net hosts."

[[tracker]]
service = "Marketo (Adobe)"
domains = ["mktdns.com", "mktoweb.com"]
source = "Adobe Marketo docs on email open tracking with an invisible image on Marketo tracking hosts."

[[tracker]]
service = "Pardot (Salesforce Account Engagement)"
