source = "Klaviyo help centre on open tracking: a hidden image served from Klaviyo tracking hosts."

[[tracker]]
service = "Brevo (Sendinblue)"
domains = ["sendibt2.com", "sendibt3.com"]
source = "Brevo help on open tracking: an invisible image from its sendibt tracking domains."

[[tracker]]
