[package]
name = "mailcrane-ffi"
description = "The only API the apps see"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[features]
# Needed only to build the `uniffi-bindgen` binary.
bindgen = ["uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[dependencies]
mailcrane-core = { path = "../mailcrane-core" }
thiserror = "2.0.21"
uniffi = "0.32.2"
