[package]
name = "mailcrane-ffi"
description = "The only API the apps see"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[features]
# Needed only to build the `uniffi-bindgen` binary.
bindgen = ["uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[dependencies]
mailcrane-core = { path = "../mailcrane-core" }
mailcrane-imap = { path = "../mailcrane-imap" }
mailcrane-store = { path = "../mailcrane-store" }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "time"] }
uniffi = { version = "0.32.2", features = ["tokio"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time"] }
mailcrane-testkit = { path = "../mailcrane-testkit" }
tempfile = "3.27.0"
