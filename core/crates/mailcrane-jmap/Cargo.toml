[package]
name = "mailcrane-jmap"
description = "JMAP client"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
http-body-util = "0.1.5"
hyper = { version = "1.13.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
rustls = "0.23.46"
rustls-platform-verifier = "0.7.1"
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["net", "time", "io-util"] }
tokio-rustls = "0.26.6"
url = "2.5.9"
# Wipes passwords and tokens (#521).
zeroize = "1.9.2"

[dev-dependencies]
mailcrane-testkit = { path = "../mailcrane-testkit" }
proptest = "1"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "time", "io-util"] }
