name: Feature request
description: Suggest a new feature or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Other apps or approaches you've seen
  - type: dropdown
    id: help
    attributes:
      label: Would you like to build it?
      options: ["Yes, me or my AI agent", "Maybe, with some help", "No, just suggesting"]
