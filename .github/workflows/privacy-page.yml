# Checks a change to docs/privacy.md before it reaches main (#475).
#
# The privacy page on mailcrane.app is built from main's docs/privacy.md by
# website/scripts/build_privacy.py on the `website` branch (roadmap-sync.yml
# and website.yml run it at every deploy). A policy the script refuses, or
# that Zola can't build, would stop every deploy after it merged. So this
# runs the same script and build on the pull request's copy first.
#
# Separate from ci.yml, which only runs `cargo xtask ci`. It has no secrets
# and reads only.
name: Privacy page

on:
  pull_request:
    paths:
      - docs/privacy.md
      - .github/workflows/privacy-page.yml

permissions:
  contents: read

concurrency:
  group: privacy-page-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the pull request's policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pr
          sparse-checkout: docs/privacy.md
          sparse-checkout-cone-mode: false
      - name: Check out the website branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: website
          path: site
      - name: Install Zola and lychee
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/getzola/zola/releases/download/v0.23.6/zola-v0.23.6-x86_64-unknown-linux-gnu.tar.gz \
            --output /tmp/zola.tar.gz
          tar -xzf /tmp/zola.tar.gz -C /tmp
          sudo install /tmp/zola /usr/local/bin/zola
          curl --fail --location --silent --show-error \
            https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-gnu.tar.gz \
            --output /tmp/lychee.tar.gz
          tar -xzf /tmp/lychee.tar.gz -C /tmp
          sudo install /tmp/lychee-x86_64-unknown-linux-gnu/lychee /usr/local/bin/lychee
      - name: Build the privacy page from this pull request's policy
        working-directory: site/website
        run: python3 scripts/build_privacy.py "$GITHUB_WORKSPACE/pr/docs/privacy.md"
      - name: Build the site
        working-directory: site/website
        run: zola build
      - name: Check links offline
        working-directory: site/website
        run: lychee --offline public/
