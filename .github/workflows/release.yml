# Release builds of the Android app (M6-03, #70). docs/releasing.md is the
# maintainer's guide; read it before changing this file.
#
#   build    no secrets. Checks the tag, runs `cargo xtask ci`, builds the
#            unsigned release APK and AAB (with checkFreeDependencies) and the
#            release notes, and uploads them as a workflow artifact.
#   sign     runs in the `release` environment, which holds the signing secrets
#            and needs a maintainer's approval. Signs the APK and AAB, writes
#            SHA256SUMS and, for a tag, attaches everything to a draft GitHub
#            Release. Without the secrets (forks, a repo not set up yet) it
#            says so and leaves the files unsigned. It never builds anything,
#            so no build script or dependency runs where the key is.
#
# Triggers:
#   push of a v* tag    full release: ci, build, sign, draft GitHub Release
#   workflow_dispatch   the same build and signing for the chosen ref, kept as
#                       a workflow artifact; no GitHub Release
#   pull_request        only when this file changes: build only, never signed
#   workflow_call       from nightly.yml (#425) with build_only: the build job
#                       only; the nightly signs in its own environment
#
# Third-party actions are pinned to a commit SHA, the same ones as ci.yml.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths: [".github/workflows/release.yml"]
  workflow_call:
    inputs:
      build_only:
        description: Run the build job only, never this workflow's sign job.
        type: boolean
        default: false
    outputs:
      version:
        description: The build's name, e.g. dev-1a2b3c4 (the artifact holds mailcrane-<version>-unsigned.apk).
        value: ${{ jobs.build.outputs.version }}

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Same as ndkVersion in android/app/build.gradle.kts and NDK_VERSION in ci.yml.
  NDK_VERSION: "30.0.16248370"
  # For zipalign and apksigner in the sign job.
  BUILD_TOOLS_VERSION: "36.0.0"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, to check that a tag is on main.
          fetch-depth: 0
          persist-credentials: false

      - name: Name this build
        id: version
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = "push" ]; then
            version="${REF_NAME#v}"
          else
            version="dev-$(git rev-parse --short=7 HEAD)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building Mailcrane $version"
          if [ "$EVENT" = "pull_request" ]; then
            echo "::notice title=Not signed::Pull request run: the release build is checked but never signed."
          fi

      - name: Tag is on main
        if: github.event_name == 'push'
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at a commit that is not on main. Tag a commit on main."
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          # Same version as rust-toolchain.toml.
          toolchain: "1.100.0"
          components: rustfmt, clippy
          targets: aarch64-linux-android,x86_64-linux-android

      # Fails fast, before the long build, if the tag and Gradle disagree.
      - name: Tag matches versionName and versionCode
        if: github.event_name == 'push'
        working-directory: core
        run: cargo xtask release-check "$GITHUB_REF_NAME"

      # No Rust cache: a release builds the core from scratch, so nothing a
      # cache holds can end up in it.
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          # cargo-ndk pinned for reproducible release builds (docs/fdroid.md).
          # cargo-about checks the in-app licences list (#366); without it
          # `cargo xtask ci --strict` fails the deny step (#413).
          tool: cargo-deny,cargo-ndk@4.1.2,cargo-about@0.9.3

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install the Android NDK
        run: sdkmanager "ndk;${NDK_VERSION}"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # Downloads come from main's cache; a release never writes one.
          cache-read-only: true

      # Every check CI runs; a release never ships what CI would refuse.
      # Pull requests already ran it in ci.yml.
      - name: cargo xtask ci
        if: github.event_name != 'pull_request'
        run: cargo xtask ci --strict
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}

      - name: Build the unsigned release APK and AAB
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease bundleRelease checkFreeDependencies

      - name: Collect the files
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk "dist/mailcrane-$VERSION-unsigned.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "dist/mailcrane-$VERSION-unsigned.aab"
          # User-facing notes from docs/changelog.d (a dry run: nothing is
          # changed in the repository).
          python3 scripts/release_notes.py "$VERSION" > dist/release-notes.md
          ls -la dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-unsigned
          path: dist/
          retention-days: 7
          if-no-files-found: error

  sign:
    needs: build
    # inputs.build_only is set only by a workflow_call (nightly.yml); for every
    # other trigger it is empty, so this is unchanged for them.
    if: github.event_name != 'pull_request' && !inputs.build_only
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Holds the signing secrets; maintainers approve each run (docs/releasing.md).
    environment: release
    permissions:
      # To create the GitHub Release. Nothing else in this job writes.
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-unsigned
          path: dist

      - name: Check for the signing secrets
        id: secrets
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # Only whether each one is set is printed, never a value.
        run: |
          missing=""
          [ -n "$KS_B64" ] || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "$KS_PASS" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || missing="$missing ANDROID_KEY_ALIAS"
          [ -n "$KEY_PASS" ] || missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::notice title=Release not signed::Missing secrets in the release environment:$missing. The APK and AAB stay unsigned and no GitHub Release is made. See docs/releasing.md."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        if: steps.secrets.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        if: steps.secrets.outputs.present == 'true'

      - name: Install zipalign and apksigner
        if: steps.secrets.outputs.present == 'true'
        run: sdkmanager "build-tools;${BUILD_TOOLS_VERSION}"

      - name: Sign the APK and AAB
        if: steps.secrets.outputs.present == 'true'
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # No `set -x`. The keystore goes to a private temp file; the passwords
        # reach the tools through environment variables (`env:` / `:env`),
        # never on a command line, where they could show in a process list.
        run: |
          set -eu
          bt="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION"
          ks="$RUNNER_TEMP/release.keystore"
          umask 077
          printf '%s' "$KS_B64" | tr -d ' \r\n' | base64 --decode > "$ks"

          cd dist
          "$bt/zipalign" -f -p 4 "mailcrane-$VERSION-unsigned.apk" aligned.apk
          "$bt/apksigner" sign --ks "$ks" --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --ks-key-alias "$ANDROID_KEY_ALIAS" --key-pass env:ANDROID_KEY_PASSWORD \
            --out "mailcrane-$VERSION.apk" aligned.apk
          rm -f aligned.apk "mailcrane-$VERSION.apk.idsig"

          cp "mailcrane-$VERSION-unsigned.aab" "mailcrane-$VERSION.aab"
          jarsigner -keystore "$ks" -storepass:env ANDROID_KEYSTORE_PASSWORD \
            -keypass:env ANDROID_KEY_PASSWORD -sigalg SHA256withRSA -digestalg SHA-256 \
            "mailcrane-$VERSION.aab" "$ANDROID_KEY_ALIAS" > /dev/null

          rm -f "$ks" "mailcrane-$VERSION-unsigned.apk" "mailcrane-$VERSION-unsigned.aab"

          # The certificate's public digests, for docs/releasing.md and F-Droid.
          "$bt/apksigner" verify --print-certs "mailcrane-$VERSION.apk" | grep -E 'SHA-256|DN'
          jarsigner -verify "mailcrane-$VERSION.aab" > /dev/null
          echo "Signed and verified."

      # Runs even if signing failed half-way, so no key is left on the runner.
      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Checksums
        run: |
          cd dist
          sha256sum -- *.apk *.aab > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ steps.secrets.outputs.present == 'true' && 'signed' || 'unsigned' }}-${{ env.VERSION }}
          path: dist/
          retention-days: 30
          if-no-files-found: error

      # A draft, so a maintainer reads it before anyone can download it.
      - name: Draft the GitHub Release
        if: github.event_name == 'push' && steps.secrets.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          files="mailcrane-$VERSION.apk mailcrane-$VERSION.aab SHA256SUMS"
          if gh release view "$TAG" > /dev/null 2>&1; then
            # A re-run: replace the files, keep the text a maintainer may have edited.
            gh release upload "$TAG" $files --clobber
          else
            pre=""
            case "$TAG" in *-*) pre="--prerelease" ;; esac
            gh release create "$TAG" $files --draft --verify-tag $pre \
              --title "Mailcrane $VERSION" --notes-file release-notes.md
          fi
          echo "Draft release: $(gh release view "$TAG" --json url --jq .url)"
