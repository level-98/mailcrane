# Lets anyone claim an issue by commenting /claim, or give it up with /unclaim.
# GitHub allows assigning anyone who has commented on the issue.
name: Claim issues

on:
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  claim:
    if: >-
      !github.event.issue.pull_request &&
      (startsWith(github.event.comment.body, '/claim') ||
       startsWith(github.event.comment.body, '/unclaim'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const user = context.payload.comment.user.login;
            const body = context.payload.comment.body.trim();
            const issue = context.payload.issue;
            const assignees = issue.assignees.map(a => a.login);
            const reply = (text) =>
              github.rest.issues.createComment({ owner, repo, issue_number, body: text });

            if (body.startsWith('/unclaim')) {
              if (!assignees.includes(user)) return reply(`@${user} this issue isn't assigned to you.`);
              await github.rest.issues.removeAssignees({ owner, repo, issue_number, assignees: [user] });
              return reply(`@${user} has released this issue. Anyone can \`/claim\` it now.`);
            }

            if (issue.state !== 'open') return reply(`@${user} this issue is closed.`);
            if (issue.labels.some(l => l.name === 'post-1.0'))
              return reply(`@${user} this is labelled \`post-1.0\`, so it can't be claimed yet.`);
            if (assignees.length > 0 && !assignees.includes(user))
              return reply(`Sorry @${user}, this is already claimed by @${assignees.join(', @')}. Have a look at other [unassigned issues](https://github.com/${owner}/${repo}/issues?q=is%3Aopen+is%3Aissue+no%3Aassignee).`);
            if (assignees.includes(user)) return reply(`@${user} you already have this one.`);

            const mine = await github.rest.search.issuesAndPullRequests({
              q: `repo:${owner}/${repo} is:issue is:open assignee:${user}`,
            });
            if (mine.data.total_count >= 2)
              return reply(`@${user} you already have ${mine.data.total_count} claimed issues. Please finish or \`/unclaim\` one first.`);

            await github.rest.issues.addAssignees({ owner, repo, issue_number, assignees: [user] });
            await reply(
              `Thanks @${user}, this is yours. The claim lapses after 14 days with no activity.\n\n` +
              `Read [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md) and [AGENTS.md](../blob/main/AGENTS.md), ` +
              `run \`cargo xtask ci\` before pushing, and put \`Closes #${issue_number}\` in your PR.`
            );
