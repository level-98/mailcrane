name: iOS

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "core/**"
      - "ios/**"
      - ".github/workflows/ios.yml"

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Install XcodeGen and SwiftLint
        run: brew install xcodegen swiftlint

      - name: Build and test
        run: cargo xtask ci --only ios --strict

      - name: Export screenshot attachments
        if: always()
        run: |
          result=$(find ios/build -name "*.xcresult" -print -quit)
          if [ -n "$result" ]; then
            xcrun xcresulttool export attachments --path "$result" --output-path ios/build/screenshots
          fi

      - name: Upload iOS screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-screenshots
          path: ios/build/screenshots
          if-no-files-found: ignore
