# The iOS app is paused until after the Android 1.0 release (ROADMAP.md, M7;
# docs/decisions/0002-android-first-ios-after-release.md). Until then this
# workflow runs only when started by hand (Actions → iOS → Run workflow), so
# PRs don't wait for a macOS runner. Task M7-02 puts the `pull_request` and
# `push` triggers back.
name: iOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Install XcodeGen and SwiftLint
        run: brew install xcodegen swiftlint

      - name: Build and test
        run: cargo xtask ci --only ios --strict

      - name: Export screenshot attachments
        if: always()
        run: |
          result=$(find ios/build -name "*.xcresult" -print -quit)
          if [ -n "$result" ]; then
            xcrun xcresulttool export attachments --path "$result" --output-path ios/build/screenshots
          fi

      - name: Upload iOS screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-screenshots
          path: ios/build/screenshots
          if-no-files-found: ignore
