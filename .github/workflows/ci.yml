# CI only installs tools and runs `cargo xtask ci`. Every check lives in
# core/xtask, so what passes locally is what passes here. Don't add check
# logic to this file.
#
# Runs on every pull request, merge queue group and push to main:
#   changes       which of the jobs below this change needs (#530), and the
#                 changelog fragments' names and types (scripts/release_notes.py)
#   lint          design, fmt, clippy and xtask's lints, cargo deny
#   test          the core's tests
#   android-lint  ktlint, then Android lint
#   android-test  the app's unit tests
#   android-apk   the debug and release builds and their checks; uploads the
#                 debug APK (android-debug-apk, which QA installs)
#   windows       fmt, clippy and tests of the core, to keep it portable
#   ci-ok         passes only if every job above passed or was rightly skipped
#
# The five Linux jobs together are `cargo xtask ci --strict`, split with
# `--only` so they run side by side (#604): together they run every step, and
# the check's name says what failed. A job that fails cancels the rest of the
# run, so ci-ok fails within minutes instead of waiting for the slowest job.
#
# What `changes` picks, from the files a pull request or merge group changes
# (renames count as both paths):
#   docs only (docs/**, website/**, *.md at the top level)
#            every job is skipped; ci-ok still runs and passes
#   android/** (and docs) only
#            the five Linux jobs run; windows is skipped
#   anything else, every push to main and every hand-started run
#            every job
# docs/dev-mail.md counts as code: an xtask test reads it. The Linux jobs
# always run together: checks cross the tree (strings, licences, the release
# guard, the core's Android-only code, the OAuth redirect), so no finer split
# by path.
#
# Third-party actions are pinned to a commit SHA; the comment gives the
# version it was taken from.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Ready for GitHub's merge queue; does nothing until it is turned on.
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The event too, so a hand-started run doesn't cancel main's push run.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Same as ndkVersion in android/app/build.gradle.kts.
  NDK_VERSION: "30.0.16248370"

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      linux: ${{ steps.pick.outputs.linux }}
      windows: ${{ steps.pick.outputs.windows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request's merge commit and its first parent, the base.
          fetch-depth: 2

      # Here, so docs-only changes run it too: release builds refuse a
      # fragment with an unknown type, and a docs PR once broke the nightly
      # that way. The script only prints the notes; nothing is written.
      - name: Changelog fragments are valid
        run: python3 scripts/release_notes.py check > /dev/null

      - name: Pick the jobs this change needs
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          set -eu
          base=""
          case "$EVENT" in
            pull_request) base="$(git rev-parse HEAD^1)" ;;
            merge_group)
              git fetch --no-tags --depth=1 origin "$MERGE_GROUP_BASE"
              base="$MERGE_GROUP_BASE"
              ;;
          esac
          # Pushes to main and hand-started runs check everything.
          linux=true
          windows=true
          if [ -n "$base" ]; then
            # --no-renames: a move out of android/ lists its old path too.
            files="$(git diff --name-only --no-renames "$base" HEAD)"
            printf 'changed files:\n%s\n' "$files"
            android=false
            other=false
            while IFS= read -r f; do
              case "$f" in
                "") ;;
                docs/dev-mail.md) other=true ;;
                docs/* | website/*) ;;
                android/*) android=true ;;
                */*) other=true ;;
                *.md) ;;
                *) other=true ;;
              esac
            done <<< "$files"
            if [ "$other" = false ]; then
              windows=false
              linux="$android"
            fi
          fi
          echo "linux=$linux windows=$windows"
          {
            echo "linux=$linux"
            echo "windows=$windows"
          } >> "$GITHUB_OUTPUT"

  lint:
    needs: changes
    if: needs.changes.outputs.linux == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Only to cancel the run when this job fails (the last step).
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          # Same version as rust-toolchain.toml.
          toolchain: "1.100.0"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: core
          key: lint
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          # cargo-about checks the in-app licences list (#366).
          tool: cargo-deny,cargo-about@0.9.3

      - run: cargo xtask ci --strict --only design,fmt,lint,deny

      - name: Cancel the rest of the run
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "${{ github.run_id }}" --repo "${{ github.repository }}" || true

  test:
    needs: changes
    if: needs.changes.outputs.linux == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: "1.100.0"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: core
          key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: cargo xtask ci --strict --only test

      - name: Cancel the rest of the run
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "${{ github.run_id }}" --repo "${{ github.repository }}" || true

  android-lint:
    needs: changes
    if: needs.changes.outputs.linux == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/android-setup
        with:
          cache-key: android-lint

      - run: cargo xtask ci --strict --only android-lint
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}

      - name: Cancel the rest of the run
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "${{ github.run_id }}" --repo "${{ github.repository }}" || true

  android-test:
    needs: changes
    if: needs.changes.outputs.linux == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/android-setup
        with:
          cache-key: android-test

      - run: cargo xtask ci --strict --only android-test
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}

      - name: Cancel the rest of the run
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "${{ github.run_id }}" --repo "${{ github.repository }}" || true

  android-apk:
    needs: changes
    if: needs.changes.outputs.linux == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/android-setup
        with:
          cache-key: android-apk

      - run: cargo xtask ci --strict --only android-apk
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}

      # So the app can be installed on a phone without building it. QA
      # downloads it by this name.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: error

      - name: Cancel the rest of the run
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "${{ github.run_id }}" --repo "${{ github.repository }}" || true

  windows:
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          # Same version as rust-toolchain.toml.
          toolchain: "1.100.0"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: core
          key: windows
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: cargo xtask ci --strict --only fmt,lint,test

      - name: Cancel the rest of the run
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "${{ github.run_id }}" --repo "${{ github.repository }}" || true

  ci-ok:
    if: always()
    needs: [changes, lint, test, android-lint, android-test, android-apk, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Fails if any job failed or was cancelled, or was skipped although
      # `changes` said this change needs it (or `changes` itself failed).
      - name: Every needed job passed
        env:
          CHANGES: ${{ needs.changes.result }}
          LINT: ${{ needs.lint.result }}
          TEST: ${{ needs.test.result }}
          ANDROID_LINT: ${{ needs.android-lint.result }}
          ANDROID_TEST: ${{ needs.android-test.result }}
          ANDROID_APK: ${{ needs.android-apk.result }}
          WINDOWS: ${{ needs.windows.result }}
          NEED_LINUX: ${{ needs.changes.outputs.linux }}
          NEED_WINDOWS: ${{ needs.changes.outputs.windows }}
        run: |
          echo "changes=$CHANGES; linux jobs ($NEED_LINUX): lint=$LINT test=$TEST" \
            "android-lint=$ANDROID_LINT android-test=$ANDROID_TEST android-apk=$ANDROID_APK;" \
            "windows ($NEED_WINDOWS): $WINDOWS"
          [ "$CHANGES" = success ] || exit 1
          # check <needed> <result>
          check() {
            case "$2" in
              success) ;;
              skipped) [ "$1" = false ] || exit 1 ;;
              *) exit 1 ;;
            esac
          }
          for result in "$LINT" "$TEST" "$ANDROID_LINT" "$ANDROID_TEST" "$ANDROID_APK"; do
            check "$NEED_LINUX" "$result"
          done
          check "$NEED_WINDOWS" "$WINDOWS"
