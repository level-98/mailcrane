# CI only installs tools and runs `cargo xtask ci`. Every check lives in
# core/xtask, so what passes locally is what passes here. Don't add check
# logic to this file.
#
# Runs on every pull request, merge queue group and push to main:
#   changes  which of the jobs below this change needs (#530), and the
#            changelog fragments' names and types (scripts/release_notes.py)
#   linux    every check, and builds the debug APK (uploaded)
#   windows  fmt, clippy and tests of the core, to keep it portable
#   label    labels a pull request by the paths it changes (scripts/pr_checks.py)
#   qa-gate  on a pull request: fails while it has needs-qa and not
#            qa-verified or qa-light, so the merge queue waits for QA (#606)
#   ci-ok    passes only if every job above passed or was rightly skipped
#
# A pull request also runs on `labeled` and `unlabeled`, so qa-gate sees QA's
# label. Such a run skips linux and windows when they already passed for
# this exact commit (nothing in the code changed), and runs them otherwise.
#
# What `changes` picks, from the files a pull request or merge group changes
# (renames count as both paths):
#   docs only (docs/**, website/**, *.md at the top level)
#            linux and windows are skipped; ci-ok still runs and passes
#   android/** (and docs) only
#            linux runs in full; windows is skipped
#   anything else, every push to main and every hand-started run
#            linux and windows, as before
# docs/dev-mail.md counts as code: an xtask test reads it. Linux always runs
# every step: checks cross the tree (strings, licences, the release guard,
# the core's Android-only code, the OAuth redirect), so no finer split.
#
# Third-party actions are pinned to a commit SHA; the comment gives the
# version it was taken from.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    # labeled/unlabeled: qa-gate re-checks when QA labels the PR (#606).
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # Ready for GitHub's merge queue; does nothing until it is turned on.
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The event too, so a hand-started run doesn't cancel main's push run.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Same as ndkVersion in android/app/build.gradle.kts.
  NDK_VERSION: "30.0.16248370"

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # On a label change: whether the builds already passed for this commit.
      checks: read
    outputs:
      linux: ${{ steps.pick.outputs.linux }}
      windows: ${{ steps.pick.outputs.windows }}
      prior: ${{ steps.pick.outputs.prior }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request's merge commit and its first parent, the base.
          fetch-depth: 2

      # Here, so docs-only changes run it too: release builds refuse a
      # fragment with an unknown type, and a docs PR once broke the nightly
      # that way. The script only prints the notes; nothing is written.
      - name: Changelog fragments are valid
        run: python3 scripts/release_notes.py check > /dev/null

      - name: Pick the jobs this change needs
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          set -eu
          : > "$RUNNER_TEMP/changed.txt"
          prior=false
          base=""
          case "$EVENT" in
            pull_request) base="$(git rev-parse HEAD^1)" ;;
            merge_group)
              git fetch --no-tags --depth=1 origin "$MERGE_GROUP_BASE"
              base="$MERGE_GROUP_BASE"
              ;;
          esac
          # Pushes to main and hand-started runs check everything.
          linux=true
          windows=true
          if [ -n "$base" ]; then
            # --no-renames: a move out of android/ lists its old path too.
            files="$(git diff --name-only --no-renames "$base" HEAD)"
            printf 'changed files:\n%s\n' "$files"
            printf '%s\n' "$files" > "$RUNNER_TEMP/changed.txt"
            android=false
            other=false
            while IFS= read -r f; do
              case "$f" in
                "") ;;
                docs/dev-mail.md) other=true ;;
                docs/* | website/*) ;;
                android/*) android=true ;;
                */*) other=true ;;
                *.md) ;;
                *) other=true ;;
              esac
            done <<< "$files"
            if [ "$other" = false ]; then
              windows=false
              linux="$android"
            fi
          fi
          # A label change alone (#606): the code is as it was, so builds that
          # already passed for this commit aren't run again.
          if [ "$EVENT" = pull_request ] && { [ "$ACTION" = labeled ] || [ "$ACTION" = unlabeled ]; }; then
            passed="$(gh api "repos/$REPO/commits/$HEAD_SHA/check-runs" --paginate \
              --jq '.check_runs[] | select(.conclusion == "success") | .name' || true)"
            has() { printf '%s\n' "$passed" | grep -qx "$1"; }
            if { [ "$linux" = false ] || has linux; } && { [ "$windows" = false ] || has windows; }; then
              echo "label change: the builds already passed for $HEAD_SHA"
              linux=false
              windows=false
              prior=true
            fi
          fi
          echo "linux=$linux windows=$windows prior=$prior"
          {
            echo "linux=$linux"
            echo "windows=$windows"
            echo "prior=$prior"
          } >> "$GITHUB_OUTPUT"

      # Code changes need a changelog fragment, unless the PR is labelled
      # no-changelog (#606). Names and types are checked above.
      - name: A changelog fragment is there
        if: github.event_name == 'pull_request'
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: python3 scripts/pr_checks.py fragment "$RUNNER_TEMP/changed.txt" "$LABELS"

  # Labels a pull request by its paths (#606): needs-qa, qa-light, area:*,
  # security. Plain pull_request, never pull_request_target, and only for
  # this repository's branches: a fork's token can't label, and fork PRs are
  # labelled by hand.
  label:
    if: >-
      github.event_name == 'pull_request' &&
      contains(fromJSON('["opened", "synchronize", "reopened"]'), github.event.action) &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts
      - name: Label by path
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -eu
          gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename' > "$RUNNER_TEMP/files.txt"
          want="$(python3 scripts/pr_checks.py labels "$RUNNER_TEMP/files.txt" | paste -sd, -)"
          echo "labels: ${want:-none}"
          [ -z "$want" ] && exit 0
          # qa-light never stays beside needs-qa: it would let the change past qa-gate.
          if printf '%s' "$want" | grep -q 'needs-qa'; then
            gh pr edit "$PR" --repo "$REPO" --add-label "$want" --remove-label qa-light
          else
            gh pr edit "$PR" --repo "$REPO" --add-label "$want"
          fi

  # Fails while the PR waits for QA (#606). It reads the PR's labels now,
  # not the event's: labels the label job just set raise no new event.
  qa-gate:
    if: always() && github.event_name == 'pull_request'
    needs: [label]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts
      - name: QA has checked it, if it needs QA
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -eu
          labels="$(gh api "repos/$REPO/issues/$PR/labels" --jq '[.[].name]')"
          echo "labels: $labels"
          python3 scripts/pr_checks.py qa-gate "$labels"

  linux:
    needs: changes
    if: needs.changes.outputs.linux == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          # Same version as rust-toolchain.toml.
          toolchain: "1.100.0"
          components: rustfmt, clippy
          # cargo-ndk builds the core for these when Gradle runs.
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: core
          key: linux

      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          # cargo-ndk pinned for reproducible release builds (docs/fdroid.md).
          # cargo-about checks the in-app licences list (#366).
          tool: cargo-deny,cargo-ndk@4.1.2,cargo-about@0.9.3

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install the Android NDK
        run: sdkmanager "ndk;${NDK_VERSION}"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - run: cargo xtask ci --strict
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}

      # So the app can be installed on a phone without building it.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: error

  windows:
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          # Same version as rust-toolchain.toml.
          toolchain: "1.100.0"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: core
          key: windows

      - run: cargo xtask ci --strict --only fmt,lint,test

  ci-ok:
    if: always()
    needs: [changes, label, qa-gate, linux, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Fails if any job failed or was cancelled, or was skipped although
      # `changes` said this change needs it (or `changes` itself failed).
      - name: Every needed job passed
        env:
          CHANGES: ${{ needs.changes.result }}
          LINUX: ${{ needs.linux.result }}
          WINDOWS: ${{ needs.windows.result }}
          NEED_LINUX: ${{ needs.changes.outputs.linux }}
          NEED_WINDOWS: ${{ needs.changes.outputs.windows }}
          PRIOR: ${{ needs.changes.outputs.prior }}
          LABEL: ${{ needs.label.result }}
          QA_GATE: ${{ needs.qa-gate.result }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "changes=$CHANGES linux=$LINUX ($NEED_LINUX) windows=$WINDOWS ($NEED_WINDOWS) prior=$PRIOR"
          echo "label=$LABEL qa-gate=$QA_GATE"
          [ "$CHANGES" = success ] || exit 1
          # The labeller only runs on some events; when it ran, it must have
          # worked, or qa-gate could miss needs-qa.
          case "$LABEL" in success | skipped) ;; *) exit 1 ;; esac
          # On a pull request qa-gate always runs and must pass (#606).
          if [ "$EVENT" = pull_request ]; then
            [ "$QA_GATE" = success ] || exit 1
          fi
          # check <needed> <result>
          check() {
            case "$2" in
              success) ;;
              skipped) [ "$1" = false ] || exit 1 ;;
              *) exit 1 ;;
            esac
          }
          check "$NEED_LINUX" "$LINUX"
          check "$NEED_WINDOWS" "$WINDOWS"
