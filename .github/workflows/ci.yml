# CI only installs tools and runs `cargo xtask ci`. Every check lives in
# core/xtask, so what passes locally is what passes here. Don't add check
# logic to this file.
#
# Runs on every pull request, merge queue group and push to main:
#   changes  which of the jobs below this change needs (#530)
#   linux    every check, and builds the debug APK (uploaded)
#   windows  fmt, clippy and tests of the core, to keep it portable
#   ci-ok    passes only if every job above passed or was rightly skipped
#
# What `changes` picks, from the files a pull request or merge group changes:
#   docs only (docs/**, website/**, *.md at the top level)
#            linux and windows are skipped; ci-ok still runs and passes
#   android/** (and docs) only
#            linux runs `design` and `android` (which builds the core for
#            the app); windows is skipped
#   core/crates/** outside mailcrane-ffi (and docs) only
#            linux runs every step except `android`; windows runs
#   anything else (the FFI, xtask, Cargo files, design, workflows, ...),
#   both android and core, every push to main and every hand-started run
#            everything, as before
# docs/dev-mail.md counts as code: an xtask test reads it.
#
# Third-party actions are pinned to a commit SHA; the comment gives the
# version it was taken from.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Ready for GitHub's merge queue; does nothing until it is turned on.
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Same as ndkVersion in android/app/build.gradle.kts.
  NDK_VERSION: "30.0.16248370"

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.pick.outputs.rust }}
      android: ${{ steps.pick.outputs.android }}
      steps: ${{ steps.pick.outputs.steps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request's merge commit and its first parent, the base.
          fetch-depth: 2

      - name: Pick the jobs this change needs
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          set -eu
          base=""
          case "$EVENT" in
            pull_request) base="$(git rev-parse HEAD^1)" ;;
            merge_group)
              git fetch --no-tags --depth=1 origin "$MERGE_GROUP_BASE"
              base="$MERGE_GROUP_BASE"
              ;;
          esac
          # Pushes to main and hand-started runs check everything.
          rust=true
          android=true
          if [ -n "$base" ]; then
            files="$(git diff --name-only "$base" HEAD)"
            printf 'changed files:\n%s\n' "$files"
            rust=false
            android=false
            other=false
            while IFS= read -r f; do
              case "$f" in
                "") ;;
                docs/dev-mail.md) other=true ;;
                docs/* | website/*) ;;
                android/*) android=true ;;
                core/crates/mailcrane-ffi/*) other=true ;;
                core/crates/*) rust=true ;;
                */*) other=true ;;
                *.md) ;;
                *) other=true ;;
              esac
            done <<< "$files"
            if [ "$other" = true ]; then
              rust=true
              android=true
            fi
          fi
          steps=design
          if [ "$rust" = true ]; then steps="$steps,fmt,lint,test,deny"; fi
          if [ "$android" = true ]; then steps="$steps,android"; fi
          echo "rust=$rust android=$android steps=$steps"
          {
            echo "rust=$rust"
            echo "android=$android"
            echo "steps=$steps"
          } >> "$GITHUB_OUTPUT"

  linux:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          # Same version as rust-toolchain.toml.
          toolchain: "1.100.0"
          components: rustfmt, clippy
          # cargo-ndk builds the core for these when Gradle runs.
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: core
          key: linux

      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          # cargo-ndk pinned for reproducible release builds (docs/fdroid.md).
          # cargo-about checks the in-app licences list (#366).
          tool: cargo-deny,cargo-ndk@4.1.2,cargo-about@0.9.3

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        if: needs.changes.outputs.android == 'true'
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        if: needs.changes.outputs.android == 'true'

      - name: Install the Android NDK
        if: needs.changes.outputs.android == 'true'
        run: sdkmanager "ndk;${NDK_VERSION}"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        if: needs.changes.outputs.android == 'true'

      - run: cargo xtask ci --strict --only "$STEPS"
        env:
          STEPS: ${{ needs.changes.outputs.steps }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}

      # So the app can be installed on a phone without building it.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.changes.outputs.android == 'true'
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: error

  windows:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          # Same version as rust-toolchain.toml.
          toolchain: "1.100.0"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: core
          key: windows

      - run: cargo xtask ci --strict --only fmt,lint,test

  ci-ok:
    if: always()
    needs: [changes, linux, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Fails if any job failed or was cancelled, or was skipped although
      # `changes` said this change needs it (or `changes` itself failed).
      - name: Every needed job passed
        env:
          CHANGES: ${{ needs.changes.result }}
          LINUX: ${{ needs.linux.result }}
          WINDOWS: ${{ needs.windows.result }}
          RUST: ${{ needs.changes.outputs.rust }}
          ANDROID: ${{ needs.changes.outputs.android }}
        run: |
          echo "changes=$CHANGES linux=$LINUX windows=$WINDOWS (rust=$RUST android=$ANDROID)"
          [ "$CHANGES" = success ] || exit 1
          need_linux=false
          if [ "$RUST" = true ] || [ "$ANDROID" = true ]; then need_linux=true; fi
          # check <needed> <result>
          check() {
            case "$2" in
              success) ;;
              skipped) [ "$1" = false ] || exit 1 ;;
              *) exit 1 ;;
            esac
          }
          check "$need_linux" "$LINUX"
          check "$RUST" "$WINDOWS"
