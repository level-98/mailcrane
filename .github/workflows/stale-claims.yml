# Every day, unassigns issues that have had no activity for 14 days
# and have no open PR linked to them, so stale claims don't block anyone.
name: Release stale claims

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const DAYS = 14;
            const cutoff = Date.now() - DAYS * 24 * 60 * 60 * 1000;

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', assignee: '*', per_page: 100,
            });

            const openPrs = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', per_page: 100,
            });

            for (const issue of issues) {
              if (issue.pull_request) continue;
              if (new Date(issue.updated_at).getTime() > cutoff) continue;

              const n = issue.number;
              const linked = openPrs.some(pr =>
                new RegExp(`(close[sd]?|fix(e[sd])?|resolve[sd]?|builds on)\\s+#${n}\\b`, 'i').test(pr.body || '')
              );
              if (linked) continue;

              const who = issue.assignees.map(a => a.login);
              await github.rest.issues.removeAssignees({ owner, repo, issue_number: n, assignees: who });
              await github.rest.issues.createComment({
                owner, repo, issue_number: n,
                body: `No activity for ${DAYS} days, so this claim has lapsed and the issue is free again. ` +
                      `@${who.join(', @')}, if you're still on it, just comment \`/claim\` again.`,
              });
              core.info(`Released #${n} from ${who.join(', ')}`);
            }
