name: Website

on:
  pull_request:
    branches:
      - website
    paths:
      - website/**
      - .github/workflows/website.yml
  push:
    branches:
      - website
    paths:
      - website/**
      - .github/workflows/website.yml
permissions:
  contents: read
  issues: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - name: Install Zola
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/getzola/zola/releases/download/v0.23.6/zola-v0.23.6-x86_64-unknown-linux-gnu.tar.gz \
            --output /tmp/zola.tar.gz
          tar -xzf /tmp/zola.tar.gz -C /tmp
          sudo install /tmp/zola /usr/local/bin/zola
      - name: Install lychee
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-gnu.tar.gz \
            --output /tmp/lychee.tar.gz
          tar -xzf /tmp/lychee.tar.gz -C /tmp
          sudo install /tmp/lychee-x86_64-unknown-linux-gnu/lychee /usr/local/bin/lychee
      - name: Refresh roadmap snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/update_roadmap.py
      - name: Test roadmap generator
        run: python3 -m unittest discover -s tests -v
      - name: Build site
        run: zola build
      - name: Check links offline
        run: lychee --offline public/
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/website'
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/public

  deploy:
    if: github.ref == 'refs/heads/website'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
