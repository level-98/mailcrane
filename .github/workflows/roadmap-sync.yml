# Keeps the task boxes in ROADMAP.md in step with the issues.
#
# When a roadmap issue ("[M1-04] …") is closed, reopened or retitled, once a
# day, or when run by hand, this runs scripts/sync_roadmap.py. If ROADMAP.md
# needs changing it opens (or refreshes) one PR from the `bot/roadmap-sync`
# branch and sets it to merge once CI passes. It never pushes to `main`, so
# branch protection still applies.
#
# The website job checks out the separate `website` branch, refreshes its local
# issue snapshot and uploads the built site; the deploy job then publishes it
# through Pages. Keeping this trigger on the default branch lets issue and
# scheduled events update the site without browser calls to GitHub or site
# content being added to `main`.
#
# The privacy page is built from `docs/privacy.md` on `main`, the one copy of
# the policy (#475): the website job checks out that file next to the website
# branch and runs website/scripts/build_privacy.py before the build. A push to
# `main` that changes the policy redeploys the site straight away.
#
# Setup: Settings → Actions → General → Workflow permissions →
# tick "Allow GitHub Actions to create and approve pull requests".
#
# The sync PR is pushed and opened with a token from the roadmap GitHub App
# (#599), so CI runs on it like on any other PR: GitHub doesn't start other
# workflows for pushes and PRs made with the built-in token. Setup: create the
# app with Contents and Pull requests (read and write) on this repository,
# install it here, then add its App ID as the repository variable
# ROADMAP_APP_ID and its private key as the secret ROADMAP_APP_PRIVATE_KEY.
# Without them (a fork, or before setup) the job falls back to the built-in
# token and says so: CI on the sync PR then waits for a maintainer's approval.
#
# The PR is set to merge on its own (`--auto`, through the merge queue) once
# ci-ok passes. If GitHub refuses that, the PR stays open for a maintainer and
# the run logs a warning.
name: Sync roadmap

on:
  issues:
    types: [opened, closed, reopened, edited]
  schedule:
    - cron: "41 5 * * *"
  push:
    branches: [main]
    paths: [docs/privacy.md]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: read

jobs:
  website:
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, '[')
    runs-on: ubuntu-latest
    concurrency:
      group: website-refs/heads/website
      cancel-in-progress: false
    permissions:
      contents: read
      issues: read
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
        with:
          ref: website
      - name: Check out the privacy policy from main
        uses: actions/checkout@v7
        with:
          ref: main
          path: website/.policy
          sparse-checkout: docs/privacy.md
          sparse-checkout-cone-mode: false
      - name: Install Zola
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/getzola/zola/releases/download/v0.23.6/zola-v0.23.6-x86_64-unknown-linux-gnu.tar.gz \
            --output /tmp/zola.tar.gz
          tar -xzf /tmp/zola.tar.gz -C /tmp
          sudo install /tmp/zola /usr/local/bin/zola
      - name: Install lychee
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-gnu.tar.gz \
            --output /tmp/lychee.tar.gz
          tar -xzf /tmp/lychee.tar.gz -C /tmp
          sudo install /tmp/lychee-x86_64-unknown-linux-gnu/lychee /usr/local/bin/lychee
      - name: Refresh roadmap snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/update_roadmap.py
      - name: Test roadmap generator
        run: python3 -m unittest discover -s tests -v
      - name: Build the privacy page from docs/privacy.md
        run: python3 scripts/build_privacy.py .policy/docs/privacy.md
      - name: Build site
        run: zola build
      - name: Check links offline
        run: lychee --offline public/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/public

  # Deploy in its own job, as website.yml does. Run in the same job straight
  # after the upload, deploy-pages sometimes looks the artifact up before
  # GitHub lists it and fails with 'No artifacts named "github-pages"'.
  deploy:
    needs: website
    runs-on: ubuntu-latest
    concurrency:
      group: website-refs/heads/website
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  sync:
    if: github.event_name != 'push' && (github.event_name != 'issues' || startsWith(github.event.issue.title, '['))
    runs-on: ubuntu-latest
    # Only the sync job queues behind itself, so a policy push (which skips
    # this job) can't replace a waiting issues run. The website and deploy
    # jobs have their own group, shared with website.yml.
    concurrency:
      group: roadmap-sync
      cancel-in-progress: false
    env:
      BRANCH: bot/roadmap-sync
      # Secrets can't be tested in `if:`; this says only whether one is set.
      HAS_APP_KEY: ${{ secrets.ROADMAP_APP_PRIVATE_KEY != '' }}
    steps:
      # The app's token is minted only here, in this job, and only with the
      # two permissions the push and the PR need. The action masks it in logs
      # and revokes it when the job ends.
      - name: Get the roadmap app's token
        id: app
        if: vars.ROADMAP_APP_ID != '' && env.HAS_APP_KEY == 'true'
        # A broken app setup falls back to the built-in token, like none.
        continue-on-error: true
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ vars.ROADMAP_APP_ID }}
          private-key: ${{ secrets.ROADMAP_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Say which token opens the PR
        env:
          OUTCOME: ${{ steps.app.outcome }}
        run: |
          case "$OUTCOME" in
            success)
              echo "Pushing and opening the sync PR with the roadmap app's token, so CI runs on it." ;;
            failure)
              echo "::warning::The roadmap app's token couldn't be minted (check ROADMAP_APP_ID, ROADMAP_APP_PRIVATE_KEY and the app's installation), so the sync PR uses the built-in token, and its CI waits for a maintainer's approval." ;;
            *)
              echo "::notice::ROADMAP_APP_ID or ROADMAP_APP_PRIVATE_KEY isn't set, so the sync PR uses the built-in token. GitHub doesn't run CI for it until a maintainer approves the run (see the setup note at the top of roadmap-sync.yml)." ;;
          esac

      - uses: actions/checkout@v7
        with:
          ref: main
          # Pushes made with this token start CI on the sync PR.
          token: ${{ steps.app.outputs.token || github.token }}

      - name: Update ROADMAP.md from the issues
        run: python3 scripts/sync_roadmap.py

      - name: Open, refresh or close the sync PR
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
        run: |
          set -euo pipefail
          open_pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')

          if git diff --quiet -- ROADMAP.md; then
            echo "ROADMAP.md on main already matches the issues."
            if [ -n "$open_pr" ]; then
              gh pr close "$open_pr" --delete-branch \
                --comment "No longer needed: ROADMAP.md on main already matches the issues."
            fi
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add ROADMAP.md
          git commit -m "docs: sync roadmap with issues"
          git push --force origin "$BRANCH"

          if [ -z "$open_pr" ]; then
            pr_url=$(gh pr create --base main --head "$BRANCH" \
              --title "docs: sync roadmap with issues" \
              --body "Automated by \`.github/workflows/roadmap-sync.yml\`: ticks or unticks task boxes in \`ROADMAP.md\` to match the issues (\`scripts/sync_roadmap.py\`). The workflow sets it to merge once ci-ok passes; if it stays open, see the run log. This branch is rebuilt from \`main\` on every run, so don't push your own changes to it.")
            pr="${pr_url##*/}"
            echo "Opened PR #$pr."
          else
            pr="$open_pr"
            echo "Refreshed PR #$pr."
          fi

          # Queue only the commit pushed above, so nothing else can slip in.
          # --auto: GitHub merges it through the merge queue once ci-ok passes,
          # which it can only do when CI ran (the app's token, above). With the
          # built-in token it waits for a maintainer to approve the CI run.
          head=$(git rev-parse HEAD)
          if gh pr merge "$pr" --auto --match-head-commit "$head"; then
            echo "PR #$pr will merge once ci-ok passes."
          else
            echo "::warning::Couldn't set PR #$pr to merge on its own (branch protection may need a review). It's left open for a maintainer."
          fi
